name: Deploy to Vercel (production)

# Every push to main is checked (lint + typecheck) and, if it passes, released to Vercel production.
#
# Required GitHub repository secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN       - vercel.com -> Account Settings -> Tokens
#   VERCEL_ORG_ID      - "orgId" in .vercel/project.json after running `npx vercel link` locally
#   VERCEL_PROJECT_ID  - "projectId" in the same file
#
# App environment variables (Razorpay, SMTP, Google Drive, NEXT_PUBLIC_FREE_LAUNCH, ...) are NOT
# stored here: set them in Vercel -> Project -> Settings -> Environment Variables (Production).
# `vercel pull` below downloads them for the build.

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-deploys from the Actions tab

concurrency:
  group: vercel-production
  cancel-in-progress: false # never cancel a release half-way; queue the next one

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  deploy:
    name: Deploy to production
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings and production env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
